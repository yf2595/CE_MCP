[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aidc-ce-mcp-security"
version = "0.1.0"
description = "AIDC'26 CE-MCP security evaluation testbed"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.20,<2",
  "openai>=1.40",
  "pydantic>=2",
  "python-dotenv>=1.0",
  "pyyaml>=6",
  "pandas>=2",
  "numpy>=1.26",
  "scipy>=1.11",
  "pytest>=8",
  "tenacity>=8",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
